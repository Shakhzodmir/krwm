<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFAF6">
<title>Страница не найдена · Korean with Madie</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/pwa/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/pwa/favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   404 для GitHub Pages. Страница самодостаточна и живёт по любому
   адресу, поэтому все пути — абсолютные от корня сайта.
   Комдори — фото игрушки из приложения (/assets/bear2.png), лупа
   нарисована поверх в координатах самой картинки (428×600).
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --cream:#FFFAF6; --paper:#FCF5F1; --petal:#F7CDD2; --coral:#BC4B5E; --plum:#8E3F4D;
  --berry:#5C2A33; --ink:#2A1A1E; --card:#FFFFFF;
  --line:rgba(92,42,51,.10); --line-strong:rgba(92,42,51,.18);
  --soft:rgba(92,42,51,.72); --hush:rgba(92,42,51,.58);
  --accent-rgb:188,75,94;
  --grad-coral:linear-gradient(140deg,#D9687A 0%,#BC4B5E 100%);
  --shadow-sm:0 1px 2px rgba(92,42,51,.04), 0 2px 6px rgba(242,166,174,.10);
  --shadow-md:0 2px 6px rgba(92,42,51,.05), 0 8px 22px -10px rgba(var(--accent-rgb),.22);
  --shadow-lg:0 4px 12px -4px rgba(92,42,51,.10), 0 18px 40px -16px rgba(var(--accent-rgb),.30);
  --floor:rgba(92,42,51,.14);
  --lens-rim:#5C2A33; --lens-handle:#C9A55C;
  --bear-shadow:drop-shadow(0 10px 16px rgba(92,42,51,.18));
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.32,1.18,.55,1);
}
body.theme-dark{
  color-scheme:dark;
  --cream:#161618; --paper:#1B1C1F; --petal:#4A2C34; --coral:#CD6379; --plum:#D77F90;
  --berry:#E7EBF4; --ink:#E7EBF4; --card:#1E1F23;
  --line:rgba(231,235,244,.09); --line-strong:rgba(231,235,244,.17);
  --soft:rgba(231,235,244,.64); --hush:rgba(231,235,244,.56);
  --accent-rgb:205,99,121;
  --grad-coral:#A53A52;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.3);
  --shadow-md:0 2px 6px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.55);
  --shadow-lg:0 4px 12px -4px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.6);
  --floor:rgba(231,235,244,.10);
  --lens-rim:#CD6379;
  --bear-shadow:drop-shadow(0 10px 18px rgba(0,0,0,.45));
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; line-height:1.5;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
h1,p{margin:0}
:focus-visible{outline:3px solid var(--coral); outline-offset:3px; border-radius:8px}

.scene{
  position:relative; min-height:100dvh; overflow:hidden; isolation:isolate;
  background:radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.65), transparent 62%), var(--cream);
  touch-action:pan-y;
}
body.theme-dark .scene{
  background:radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.05), transparent 62%), var(--cream);
}

.brand{
  position:absolute; top:max(18px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:9px; z-index:5; text-decoration:none; color:var(--ink);
  font-size:13.5px; font-weight:600; white-space:nowrap;
}
.brand-dot{width:22px; height:22px; border-radius:50%; background:var(--grad-coral); box-shadow:var(--shadow-sm)}

.floor{
  position:absolute; left:0; right:0; bottom:min(12vh,90px); height:1.5px;
  background:linear-gradient(90deg, transparent, var(--line-strong) 12%, var(--line-strong) 88%, transparent);
}

/* Копия сцены под лупой и над ней — совмещены пиксель в пиксель */
.layer{position:absolute; inset:0; display:grid; place-items:center; padding:0 20px}
.copy{text-align:center; transform:translateY(-12vh)}
.glyph{
  font-family:'Fraunces',Georgia,serif; font-weight:700; letter-spacing:-.04em;
  font-size:clamp(110px,24vw,220px); line-height:.86; color:var(--petal); user-select:none;
}
.copy h1{
  font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-.02em;
  font-size:clamp(24px,4.6vw,34px); margin-top:8px; color:var(--berry);
}
.copy p{
  margin:8px auto 0; height:52px; max-width:40ch; text-align:center;
  font-size:15px; line-height:1.4; color:var(--soft);
}
.copy .path{
  display:block; margin:3px auto 0; max-width:min(78vw,440px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12.5px; color:var(--hush);
}
/* Кнопки живут только в базовом слое; в слое-находке на их месте пустое место той же высоты */
.actions{display:flex; gap:10px; justify-content:center; margin-top:22px; height:50px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; padding:0 22px; height:50px;
  border-radius:16px; font-size:15px; font-weight:600; text-decoration:none; cursor:pointer; border:0;
  transition:transform .15s var(--ease-spring), box-shadow .25s var(--ease-out);
}
.btn:active{transform:scale(.97)}
.btn--main{background:var(--grad-coral); color:#fff; box-shadow:var(--shadow-md)}
.btn--main:hover{box-shadow:var(--shadow-lg)}
.btn--ghost{background:var(--card); color:var(--plum); border:1.5px solid var(--line-strong); font:inherit; font-weight:600}
.btn--ghost:hover{border-color:var(--coral)}

/* Слой-находка: виден только под стеклом. Круг обрезки — неподвижная точка
   масштаба, поэтому радиус клипа заранее поделён на зум. */
.found{
  clip-path:circle(var(--clip-r,0px) at var(--lx,-999px) var(--ly,-999px));
  transform:scale(var(--zoom,1.3)); transform-origin:var(--lx,-999px) var(--ly,-999px);
  background:
    repeating-linear-gradient(0deg, transparent 0 15px, rgba(var(--accent-rgb),.16) 15px 16px),
    repeating-linear-gradient(90deg, transparent 0 15px, rgba(var(--accent-rgb),.16) 15px 16px),
    var(--paper);
  will-change:clip-path,transform; pointer-events:none;
}
.found .glyph{color:var(--coral)}
.found h1{color:var(--coral)}
.found p{color:var(--plum); font-weight:500}
.found p .ko{font-family:'Noto Sans KR',system-ui,sans-serif; font-size:20px; font-weight:700; margin-right:6px}

.crumbs{position:absolute; inset:0; pointer-events:none}
.crumb{
  position:absolute; transform:translate(-50%,-50%); text-align:center; white-space:nowrap;
  font-family:'Noto Sans KR',system-ui,sans-serif; font-size:14px; line-height:1.2; font-weight:600; color:var(--coral);
}
.crumb small{display:block; font-family:'Inter',system-ui,sans-serif; font-size:9px; font-weight:600; letter-spacing:.02em; color:var(--plum)}
.crumb i{display:block; font-style:normal; font-weight:500; color:var(--soft)}

.bear{
  position:absolute; bottom:min(9vh,64px); left:0; width:clamp(120px,15vw,160px);
  will-change:transform; pointer-events:none; transform-origin:50% 100%;
}
.bear img{display:block; width:100%; height:auto; user-select:none; filter:var(--bear-shadow)}
.bear .lens{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.bear::after{
  content:''; position:absolute; left:16%; right:16%; bottom:2px; height:14px;
  border-radius:50%; background:radial-gradient(closest-side, var(--floor), transparent);
}

.hint{
  position:absolute; left:50%; bottom:max(20px, env(safe-area-inset-bottom)); transform:translateX(-50%);
  padding:7px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line);
  font-size:12.5px; color:var(--soft); box-shadow:var(--shadow-sm); white-space:nowrap; pointer-events:none;
  transition:opacity .45s var(--ease-out);
}
.scene.is-active .hint{opacity:0}

@media (max-width:720px){
  .layer{align-items:start; padding:calc(max(18px, env(safe-area-inset-top)) + 52px) 20px 0}
  .copy{transform:none}
  .glyph{font-size:clamp(96px,26vw,150px)}
  .actions{flex-direction:column; align-items:center; height:auto}
  .btn{width:min(100%,280px)}
  .bear{width:clamp(118px,30vw,150px); bottom:min(10vh,70px)}
  .floor{bottom:min(13vh,92px)}
}
@media (max-height:600px) and (min-width:721px){
  .copy{transform:translateY(-9vh)}
  .glyph{font-size:clamp(90px,16vw,140px)}
  .bear{width:116px; bottom:36px}
  .floor{bottom:60px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="scene" id="scene" tabindex="0"
      aria-label="Страница не найдена. Комдори с лупой ходит по экрану; управление стрелками влево и вправо.">
  <a class="brand" href="/"><span class="brand-dot" aria-hidden="true"></span>Korean with Madie</a>
  <div class="floor" aria-hidden="true"></div>

  <div class="layer">
    <div class="copy">
      <div class="glyph" aria-hidden="true">404</div>
      <h1>Страница не найдена</h1>
      <p>Такого адреса нет<span class="path" id="path"></span></p>
      <div class="actions">
        <a class="btn btn--main" href="/">На главную</a>
        <button class="btn btn--ghost" id="back" type="button" hidden>Назад</button>
      </div>
    </div>
  </div>

  <!-- Слой-находка: та же структура, иначе цифры под стеклом разъедутся -->
  <div class="layer found" id="found" aria-hidden="true">
    <div class="copy">
      <div class="glyph">404</div>
      <h1>Страница не найдена</h1>
      <p><span class="ko">없어요</span> опсоё — «этого нет»</p>
      <div class="actions"></div>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </div>

  <div class="bear" id="bear" aria-hidden="true">
    <img src="/assets/bear2.png" alt="" draggable="false">
    <svg class="lens" viewBox="0 0 428 600" fill="none">
      <line x1="62" y1="224" x2="28" y2="168" stroke="var(--lens-handle)" stroke-width="15" stroke-linecap="round"/>
      <circle cx="-18" cy="112" r="72" fill="#fff" fill-opacity=".08"/>
      <circle cx="-18" cy="112" r="72" stroke="var(--lens-rim)" stroke-width="13"/>
      <path d="M-60 80 q16-24 42-26" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".5"/>
    </svg>
  </div>

  <p class="hint" id="hint">Ведите курсор — Комдори пойдёт за вами</p>
</main>

<script>
(function () {
  'use strict';

  /* ── Тема: как в приложении — настройка пользователя или ночь (20:00–08:00),
        иначе системная. Настройки лежат в madie_u_<id>_settings. ── */
  (function applyTheme() {
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      var h = new Date().getHours(), night = h >= 20 || h < 8, found = false;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!/^madie_u_.+_settings$/.test(k)) continue;
        var s = JSON.parse(localStorage.getItem(k) || 'null');
        if (!s || typeof s !== 'object') continue;
        found = true;
        dark = !!s.darkTheme || (!!s.darkAuto && night);
        if (dark) break;
      }
      void found;
    } catch (_) {}
    document.body.classList.toggle('theme-dark', dark);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#161618' : '#FFFAF6');
  })();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Адрес, которого нет, и кнопка «Назад» ── */
  document.getElementById('path').textContent = location.pathname + location.search;
  var back = document.getElementById('back');
  if (history.length > 1) {
    back.hidden = false;
    back.addEventListener('click', function () { history.back(); });
  }

  /* ── Комдори с лупой ── */
  var scene = document.getElementById('scene');
  var bear  = document.getElementById('bear');
  var found = document.getElementById('found');
  var crumbHost = document.getElementById('crumbs');

  var BW = 428;                    // ширина фото — лупа задана в его координатах
  var LENS = { x: -18, y: 112 };   // центр стекла (слева над поднятой лапой)
  var LENS_R = 72;
  var STRIDE = 34;                 // пикселей на полшага
  var ZOOM = 1.3;
  var SWAY = 2.2;                  // градусов покачивания игрушки при ходьбе

  var bx = 0, targetX = 0, phase = 0;
  var lastInput = 0, wanderAt = 0, running = false, started = false;

  function sceneW() { return scene.clientWidth; }
  function bearW()  { return bear.offsetWidth; }
  function bearH()  { return bear.offsetHeight; }
  function edgeL()  { return bearW() / 2 + (LENS_R - LENS.x) * (bearW() / BW); }
  function edgeR()  { return bearW() / 2 + 6; }
  function clampX(x){ return Math.max(edgeL(), Math.min(sceneW() - edgeR(), x)); }

  var CRUMBS = [
    ['어디', 'оди', 'где'], ['왜', 'вэ', 'почему'], ['길', 'киль', 'путь'],
    ['흔적', 'хынджок', 'след'], ['없다', 'опта', 'нет'], ['여기', 'ёги', 'здесь'],
    ['저기', 'чоги', 'там'], ['찾다', 'чхатта', 'искать'], ['다시', 'таси', 'снова'],
    ['집', 'чип', 'дом'], ['아무도', 'амудо', 'никого'], ['지도', 'чидо', 'карта'],
    ['페이지', 'пхеиджи', 'страница'], ['어떻게', 'оттокхе', 'как']
  ];

  // Стекло ходит только по горизонтали — улики сеем полосой на его высоте.
  function seedCrumbs() {
    var w = sceneW(), h = scene.clientHeight;
    if (!w || !h || !bearW()) return;
    var k = bearW() / BW;
    var band = bear.offsetTop + LENS.y * k;
    var win = LENS_R * k / ZOOM;
    var step = Math.max(50, win * 2.4);
    var html = '', i = 0;
    for (var x = step * 0.5; x < w + step; x += step) {
      var item = CRUMBS[i % CRUMBS.length]; i++;
      html += '<span class="crumb" style="left:' + ((x / w) * 100).toFixed(2) + '%;top:' +
              ((band / h) * 100).toFixed(2) + '%">' +
              item[0] + '<small>' + item[1] + '<i>' + item[2] + '</i></small></span>';
    }
    crumbHost.innerHTML = html;
  }

  function place() {
    var k = bearW() / BW, half = bearW() / 2, h = bearH();
    var s = Math.sin(phase);
    var bob = -Math.abs(s) * 3;
    var tilt = s * SWAY;
    bear.style.transform = 'translate3d(' + (bx - half) + 'px,' + bob + 'px,0) rotate(' + tilt + 'deg)';

    // Стекло качается вместе с игрушкой вокруг её ног — считаем ту же точку.
    var vx = LENS.x * k - half, vy = LENS.y * k - h;
    var a = tilt * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    var lx = bx + vx * ca - vy * sa;
    var ly = bear.offsetTop + bob + h + vx * sa + vy * ca;

    found.style.setProperty('--lx', lx + 'px');
    found.style.setProperty('--ly', ly + 'px');
    found.style.setProperty('--clip-r', (LENS_R * k / ZOOM) + 'px');
    found.style.setProperty('--zoom', ZOOM);
  }

  function frame(now) {
    if (!running) return;
    if (now - lastInput > 2600 && now > wanderAt) {          // никто не ведёт — гуляет сам
      targetX = edgeL() + Math.random() * Math.max(1, sceneW() - edgeL() - edgeR());
      wanderAt = now + 2200 + Math.random() * 1800;
    }
    var gap = targetX - bx;
    if (Math.abs(gap) > 1.5) {
      var step = gap * 0.055;
      bx += step;
      phase += Math.abs(step) / STRIDE * Math.PI;               // шаг — от пройденного пути
    } else {
      phase *= 0.85;
    }
    place();
    requestAnimationFrame(frame);
  }

  function aim(clientX) {
    targetX = clampX(clientX - scene.getBoundingClientRect().left);
    lastInput = performance.now();
    if (!started) { started = true; scene.classList.add('is-active'); }
  }

  if (window.matchMedia('(hover: none)').matches) {
    document.getElementById('hint').textContent = 'Ведите пальцем — Комдори пойдёт следом';
  }
  scene.addEventListener('pointermove', function (e) { aim(e.clientX); });
  scene.addEventListener('pointerdown', function (e) { aim(e.clientX); });
  scene.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    targetX = clampX(targetX + (e.key === 'ArrowRight' ? 60 : -60));
    lastInput = performance.now();
    scene.classList.add('is-active');
  });

  var reseed;
  window.addEventListener('resize', function () {
    bx = clampX(bx); targetX = clampX(targetX);
    place();
    clearTimeout(reseed);
    reseed = setTimeout(seedCrumbs, 250);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) running = false;
    else if (!running && !reduce) { running = true; requestAnimationFrame(frame); }
  });

  function boot() {
    seedCrumbs();
    bx = targetX = clampX(sceneW() * 0.78);   // справа, чтобы не загораживать текст
    place();
    if (!reduce) { running = true; requestAnimationFrame(frame); }
  }
  var img = bear.querySelector('img');
  if (img.complete && img.naturalWidth) boot();
  else { img.addEventListener('load', boot, { once: true }); img.addEventListener('error', boot, { once: true }); }
})();
</script>
</body>
</html>
