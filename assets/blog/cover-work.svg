<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Разворот документа с визовой отметкой и печатью — рабочая виза в Корею">
  <!-- Обложка статьи о работе в Корее. Документ с визовой страницей и круглой печатью:
       вся тема упирается в бумаги — заявка, экзамен, отметка в паспорте. Печать сделана
       акцентом, потому что именно она означает «допущен». -->
  <defs>
    <linearGradient id="wk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF8"/>
      <stop offset="0.55" stop-color="#FFF6F1"/>
      <stop offset="1" stop-color="#F6E6E2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wk-bg)"/>

  <!-- Документ: две страницы -->
  <g transform="translate(206 92)">
    <!-- левая страница -->
    <rect x="0" y="0" width="380" height="446" rx="24" fill="#FFFFFF" opacity="0.9"/>
    <rect x="0" y="0" width="380" height="446" rx="24" fill="none" stroke="#F2D5DA" stroke-width="3"/>
    <!-- фото на документе -->
    <rect x="46" y="50" width="132" height="164" rx="16" fill="#FBE7EC"/>
    <circle cx="112" cy="112" r="34" fill="#F2A6AE"/>
    <path d="M58 202 a54 54 0 0 1 108 0 z" fill="#F2A6AE"/>
    <!-- строки данных -->
    <g stroke="#F2D5DA" stroke-width="12" stroke-linecap="round">
      <path d="M212 74 L330 74"/>
      <path d="M212 116 L306 116"/>
      <path d="M212 158 L334 158"/>
      <path d="M212 200 L286 200"/>
      <path d="M46 262 L334 262"/>
      <path d="M46 306 L266 306"/>
      <path d="M46 350 L310 350"/>
      <path d="M46 394 L232 394"/>
    </g>
  </g>

  <!-- правая страница: визовая отметка -->
  <g transform="translate(614 92)">
    <rect x="0" y="0" width="380" height="446" rx="24" fill="#FFFFFF" opacity="0.9"/>
    <rect x="0" y="0" width="380" height="446" rx="24" fill="none" stroke="#F2D5DA" stroke-width="3"/>
    <!-- рамка отметки -->
    <rect x="40" y="46" width="300" height="216" rx="18" fill="none" stroke="#BC4B5E" stroke-width="5"/>
    <!-- E-9 нарисовано линиями, а не текстом: шрифт на чужом устройстве может
         подставиться другой. Девятка = кружок плюс хвост от его правого края,
         иначе распадается на два несвязанных знака. -->
    <g stroke="#BC4B5E" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- E -->
      <path d="M96 104 L96 204"/>
      <path d="M96 104 L152 104"/>
      <path d="M96 154 L140 154"/>
      <path d="M96 204 L152 204"/>
      <!-- дефис -->
      <path d="M178 154 L212 154"/>
      <!-- 9: кружок и хвост одной линией -->
      <circle cx="264" cy="136" r="30"/>
      <path d="M294 136 L294 204"/>
    </g>
    <!-- машиночитаемая зона -->
    <g stroke="#F2D5DA" stroke-width="10" stroke-linecap="round">
      <path d="M40 318 L340 318"/>
      <path d="M40 356 L286 356"/>
    </g>
  </g>

  <!-- Печать поверх разворота -->
  <g transform="translate(880 400)">
    <circle cx="0" cy="0" r="86" fill="none" stroke="#C9A55C" stroke-width="9" opacity="0.95"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#C9A55C" stroke-width="4" opacity="0.8"/>
    <g stroke="#C9A55C" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M-30 4 L-8 28 L34 -22"/>
    </g>
  </g>

  <circle cx="266" cy="576" r="9" fill="#C9A55C"/>
</svg>
