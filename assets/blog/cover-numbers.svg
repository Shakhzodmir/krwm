<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Две системы счёта: китайские цифры линиями и исконный счёт точками вокруг циферблата">
  <!-- Обложка статьи о числительных. Слева — сино-корейский ряд (китайские знаки
       一二三, они же линии), справа — исконный счёт точками. В центре циферблат:
       часы считают исконными числами, минуты — сино-корейскими, и это главная
       практическая развилка темы. -->
  <defs>
    <linearGradient id="nm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF8"/>
      <stop offset="0.55" stop-color="#FFF6F1"/>
      <stop offset="1" stop-color="#F9E9E4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#nm-bg)"/>

  <!-- Слева: 一 二 三 — сино-корейский ряд -->
  <g stroke="#BC4B5E" stroke-width="16" stroke-linecap="round">
    <g transform="translate(120 150)">
      <path d="M0 0 L140 0"/>
    </g>
    <g transform="translate(120 290)">
      <path d="M20 -20 L120 -20"/>
      <path d="M0 24 L140 24"/>
    </g>
    <g transform="translate(120 430)">
      <path d="M28 0 L112 0"/>
      <path d="M14 44 L126 44"/>
      <path d="M0 88 L140 88"/>
    </g>
  </g>

  <!-- Справа: тот же счёт исконными — точками -->
  <g fill="#5C2A33">
    <circle cx="980" cy="150" r="17"/>
    <g>
      <circle cx="950" cy="300" r="17"/>
      <circle cx="1010" cy="300" r="17"/>
    </g>
    <g>
      <circle cx="920" cy="470" r="17"/>
      <circle cx="980" cy="470" r="17"/>
      <circle cx="1040" cy="470" r="17"/>
    </g>
  </g>

  <!-- Центр: циферблат. Часы — крупные точки (исконные), минуты — штрихи (сино) -->
  <g transform="translate(600 315)">
    <circle cx="0" cy="0" r="168" fill="#FFFFFF" opacity="0.72"/>
    <circle cx="0" cy="0" r="168" fill="none" stroke="#F2D5DA" stroke-width="4"/>
    <!-- минутные штрихи -->
    <g stroke="#C9A55C" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M0 -152 L0 -140"/><path d="M76 -132 L70 -121"/><path d="M132 -76 L121 -70"/>
      <path d="M152 0 L140 0"/><path d="M132 76 L121 70"/><path d="M76 132 L70 121"/>
      <path d="M0 152 L0 140"/><path d="M-76 132 L-70 121"/><path d="M-132 76 L-121 70"/>
      <path d="M-152 0 L-140 0"/><path d="M-132 -76 L-121 -70"/><path d="M-76 -132 L-70 -121"/>
    </g>
    <!-- часовые точки -->
    <g fill="#5C2A33">
      <circle cx="0" cy="-112" r="10"/><circle cx="97" cy="-56" r="10"/><circle cx="97" cy="56" r="10"/>
      <circle cx="0" cy="112" r="10"/><circle cx="-97" cy="56" r="10"/><circle cx="-97" cy="-56" r="10"/>
    </g>
    <!-- стрелки: два часа тридцать -->
    <g stroke="#BC4B5E" stroke-linecap="round" fill="none">
      <path d="M0 0 L62 -36" stroke-width="15"/>
      <path d="M0 0 L0 108" stroke-width="9"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#BC4B5E"/>
  </g>

  <!-- Золотая точка: развилка систем -->
  <circle cx="600" cy="546" r="9" fill="#C9A55C"/>
</svg>
