<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Слог 한 разбирается на три знака: ㅎ, ㅏ и ㄴ">
  <!-- Обложка статьи о хангыле. Знаки нарисованы линиями, а не текстом: у части
       читателей нет корейского шрифта, и текстовый вариант превратился бы в квадратики.
       Идея: слог 한 показан и целиком, и разобранным на три составляющие — ровно то,
       чему учит статья. -->
  <defs>
    <linearGradient id="hg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF8"/>
      <stop offset="0.55" stop-color="#FFF4F0"/>
      <stop offset="1" stop-color="#FBE7EC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hg-bg)"/>

  <!-- Разобранные знаки: три ячейки слева -->
  <g stroke="#BC4B5E" stroke-width="17" stroke-linecap="round" fill="none">
    <!-- ㅎ : шляпка, перекладина, круг -->
    <g transform="translate(150 120)">
      <path d="M60 8 L60 34"/>
      <path d="M22 58 L98 58"/>
      <circle cx="60" cy="112" r="34" stroke-width="17"/>
    </g>
    <!-- ㅏ : вертикаль и правый штрих -->
    <g transform="translate(150 320)">
      <path d="M46 8 L46 148"/>
      <path d="M46 74 L104 74"/>
    </g>
    <!-- ㄴ : угол -->
    <g transform="translate(150 520)">
      <path d="M34 -6 L34 76 L108 76"/>
    </g>
  </g>

  <!-- Тонкие направляющие: три знака собираются в один блок -->
  <g stroke="#C9A55C" stroke-width="3" fill="none" opacity="0.85">
    <path d="M300 200 C 420 200, 470 250, 560 285" stroke-dasharray="2 12" stroke-linecap="round"/>
    <path d="M300 400 C 420 400, 470 330, 560 305" stroke-dasharray="2 12" stroke-linecap="round"/>
    <path d="M300 570 C 430 570, 500 500, 600 470" stroke-dasharray="2 12" stroke-linecap="round"/>
  </g>

  <!-- Собранный слог 한 в рамке блока -->
  <g transform="translate(660 120)">
    <rect x="0" y="0" width="380" height="390" rx="34" fill="#FFFFFF" opacity="0.72"/>
    <rect x="0" y="0" width="380" height="390" rx="34" fill="none" stroke="#F2D5DA" stroke-width="4"/>
    <g stroke="#5C2A33" stroke-width="24" stroke-linecap="round" fill="none">
      <!-- ㅎ в верхнем левом углу блока -->
      <path d="M92 62 L92 88"/>
      <path d="M56 110 L128 110"/>
      <circle cx="92" cy="160" r="30"/>
      <!-- ㅏ справа -->
      <path d="M232 58 L232 198"/>
      <path d="M232 128 L292 128"/>
      <!-- ㄴ снизу во всю ширину -->
      <path d="M78 244 L78 322 L286 322"/>
    </g>
  </g>

  <!-- Золотая точка-акцент: место, где слог «щёлкает» и становится целым -->
  <circle cx="660" cy="510" r="9" fill="#C9A55C"/>
</svg>
