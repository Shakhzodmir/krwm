<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Схема: к словам прикрепляются частицы и задают их роль в предложении">
  <!-- Обложка статьи о частицах. Слова — прямоугольные блоки, частицы — маленькие
       овалы, которые к ним прицепляются и определяют роль. Порядок блоков в корейском
       свободнее, чем в русском, и держится он именно на этих хвостиках. -->
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF8"/>
      <stop offset="0.55" stop-color="#FFF4F0"/>
      <stop offset="1" stop-color="#F7E4E8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pt-bg)"/>

  <!-- Три слова с частицами, выстроенные лесенкой -->
  <g>
    <!-- Слово 1 — тема -->
    <g transform="translate(120 110)">
      <rect x="0" y="0" width="300" height="104" rx="26" fill="#FFFFFF" opacity="0.85"/>
      <rect x="0" y="0" width="300" height="104" rx="26" fill="none" stroke="#F2D5DA" stroke-width="3"/>
      <g stroke="#BC4B5E" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.55">
        <path d="M52 40 L172 40"/>
        <path d="M52 70 L124 70"/>
      </g>
      <ellipse cx="300" cy="52" rx="58" ry="40" fill="#BC4B5E"/>
      <g stroke="#FFF4F0" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M282 34 L282 70"/>
        <path d="M282 52 L316 52"/>
      </g>
    </g>

    <!-- Слово 2 — подлежащее -->
    <g transform="translate(240 262)">
      <rect x="0" y="0" width="300" height="104" rx="26" fill="#FFFFFF" opacity="0.85"/>
      <rect x="0" y="0" width="300" height="104" rx="26" fill="none" stroke="#F2D5DA" stroke-width="3"/>
      <g stroke="#BC4B5E" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.55">
        <path d="M52 40 L196 40"/>
        <path d="M52 70 L146 70"/>
      </g>
      <ellipse cx="300" cy="52" rx="58" ry="40" fill="#C9A55C"/>
      <g stroke="#FFFCF8" stroke-width="9" stroke-linecap="round" fill="none">
        <circle cx="284" cy="52" r="17"/>
        <path d="M316 32 L316 72"/>
      </g>
    </g>

    <!-- Слово 3 — дополнение -->
    <g transform="translate(360 414)">
      <rect x="0" y="0" width="300" height="104" rx="26" fill="#FFFFFF" opacity="0.85"/>
      <rect x="0" y="0" width="300" height="104" rx="26" fill="none" stroke="#F2D5DA" stroke-width="3"/>
      <g stroke="#BC4B5E" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.55">
        <path d="M52 40 L164 40"/>
        <path d="M52 70 L206 70"/>
      </g>
      <ellipse cx="300" cy="52" rx="58" ry="40" fill="#5C2A33"/>
      <g stroke="#FFF4F0" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M280 30 L280 74"/>
        <path d="M280 52 L318 52"/>
        <path d="M318 34 L318 70"/>
      </g>
    </g>
  </g>

  <!-- Сказуемое: всё сходится в конец предложения -->
  <g transform="translate(820 250)">
    <rect x="0" y="0" width="240" height="130" rx="30" fill="#5C2A33"/>
    <g stroke="#FFF4F0" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M66 42 L66 96"/>
      <path d="M66 42 L150 42"/>
      <path d="M150 42 L150 96"/>
      <path d="M66 96 L174 96"/>
    </g>
  </g>
  <g stroke="#C9A55C" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M478 162 C 640 162, 700 240, 812 292"/>
    <path d="M598 314 C 700 314, 740 314, 812 314"/>
    <path d="M718 466 C 780 466, 780 400, 812 348"/>
  </g>

  <circle cx="940" cy="440" r="9" fill="#C9A55C"/>
</svg>
